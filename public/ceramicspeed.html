        function tipoNormFromLabel(label){
            const map = { 'Ruta / TT': 'ruta', 'Montaña': 'montaña', 'Gravel': 'gravel', 'Ruta': 'ruta' };
            return map[label] || label.toLowerCase();
        }
        function modalidadesForTipo(tipoNorm){
            const m = { 'ruta': ['ruta','tt'], 'montaña': ['montaña'], 'gravel': ['gravel'] };
            return m[tipoNorm] || [];
        }

        function getMarcas(tipoLabel){
            const tipoNorm = tipoNormFromLabel(tipoLabel);
            const normList = modalidadesForTipo(tipoNorm);
            return [...new Set(BICIS.filter(b=> normList.includes(b.modalidad) && b.marca).map(b=>b.marca))].sort();
        }

            const tipoNorm = tipoNormFromLabel(tipoLabel);
            const normList = modalidadesForTipo(tipoNorm);
            return [...new Set(BICIS.filter(b=> normList.includes(b.modalidad) && b.marca===marca && /^\d+$/.test(b.anio)).map(b=>parseInt(b.anio)))].sort((a,b)=>b-a);

            const normList = modalidadesForTipo(tipoNorm);
            return [...new Set(BICIS.filter(b=> normList.includes(b.modalidad) && b.marca===marca && b.anio===String(anio) && b.referencia).map(b=>b.referencia))].sort();

            const normList = modalidadesForTipo(tipoNorm);
            const found = BICIS.find(b=> normList.includes(b.modalidad) && b.marca===marca && b.anio===String(anio) && b.referencia===modelo);
            return found ? found.medida : null;

            const tipoNorm = tipoNormFromLabel(tipoLabel);
            const normList = modalidadesForTipo(tipoNorm);
            return [...new Set(BB_LIST.filter(b=> normList.includes(b.modalidad) && b.medida===medida && b.biela).map(b=>b.biela_display))].sort();

            const tipoNorm = tipoNormFromLabel(tipoLabel);
            const normList = modalidadesForTipo(tipoNorm);
            const bLower = biela.toLowerCase();
            const found = BB_LIST.find(b=> normList.includes(b.modalidad) && b.medida===medida && b.biela===bLower);
            if(found){
                return { nombre: found.nombre, sku: found.sku, medida: found.medida, biela: found.biela_display, modalidad: tipoLabel };
            }
            return null;

            const map = { "SRAM": ["Ruta"], "Shimano": ["Ruta"] };
            return map[marca]||[];
        }

            const key = OSPW_BRAND_MOD_MAP[`${marca}|${modalidad}`];

                <section class="mb-6 max-w-md mx-auto w-full">
                    <label class="block text-center text-xs font-bold mb-4 uppercase text-gray-400 tracking-wider">SELECCIONA EL TIPO DE BICICLETA</label>
                    <div class="flex bg-surface-low rounded-full p-1 border border-surface-bright">
                        <button class="flex-1 py-3 rounded-full font-bold text-xs transition-all tracking-wider ${S.bbTipo==='Ruta / TT' ? 'bg-white text-black shadow-sm' : 'text-gray-400 hover:text-white'}" onclick="selBBTipo('Ruta / TT')">RUTA / TT</button>
                        <button class="flex-1 py-3 rounded-full font-bold text-xs transition-all tracking-wider ${S.bbTipo==='Montaña' ? 'bg-white text-black shadow-sm' : 'text-gray-400 hover:text-white'}" onclick="selBBTipo('Montaña')">MONTAÑA</button>
                        <button class="flex-1 py-3 rounded-full font-bold text-xs transition-all tracking-wider ${S.bbTipo==='Gravel' ? 'bg-white text-black shadow-sm' : 'text-gray-400 hover:text-white'}" onclick="selBBTipo('Gravel')">GRAVEL</button>
                    </div>
                </section>
                ${S.bbTipo ? `
                <div class="space-y-4 mb-8 max-w-md mx-auto w-full">
                    <div><label class="block text-center text-xs mb-2 text-gray-400 uppercase">Marca de la Bicicleta</label>
                        <select id="bbMarcaSel" class="w-full bg-surface-low border border-surface-bright rounded-xl p-4 text-white font-bold appearance-none cursor-pointer text-sm" onchange="selBBMarca(this.value)">
                            <option value="">Seleccionar Marca (${marcas.length})</option>
                            ${marcas.map(m=>`<option value="${m}" ${S.bbMarca===m?'selected':''}>${m}</option>`).join('')}
                        </select></div>
                    ${S.bbMarca ? `<div><label class="block text-center text-xs mb-2 text-gray-400 uppercase">Año del Modelo</label>
                        <select class="w-full bg-surface-low border border-surface-bright rounded-xl p-4 text-white font-bold appearance-none cursor-pointer text-sm" onchange="selBBAnio(this.value)">
                            <option value="">Seleccionar Año (${anios.length})</option>
                            ${anios.map(a=>`<option value="${a}" ${String(S.bbAnio)===String(a)?'selected':''}>${a}</option>`).join('')}
                        </select></div>` : ''}
                    ${S.bbAnio ? `<div><label class="block text-center text-xs mb-2 text-gray-400 uppercase">Modelo / Referencia</label>
                        <select class="w-full bg-surface-low border border-surface-bright rounded-xl p-4 text-white font-bold appearance-none cursor-pointer text-sm" onchange="selBBModelo(this.value)">
                            <option value="">Seleccionar Modelo (${modelos.length})</option>
                            ${modelos.map(m=>`<option value="${m}" ${S.bbModelo===m?'selected':''}>${m}</option>`).join('')}
                        </select></div>` : ''}
                    ${S.bbMedida ? `<div class="bg-surface-low border border-surface-bright rounded-xl p-4 text-center">
                        <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Estándar de Caja Detectado</span>
                        <p class="text-lg font-bold mt-1 text-emerald-400">${S.bbMedida}</p></div>` : ''}
                </div>
                ${S.bbMedida ? `<div class="max-w-md mx-auto w-full"><button class="w-full py-5 bg-white text-black font-bold rounded-full uppercase tracking-wider text-sm" onclick="S.step=2;render();">Siguiente → Marca de Biela</button></div>` : ''}
                ` : `<div class="text-center text-gray-500 text-sm mt-12 max-w-md mx-auto">Selecciona un tipo de bicicleta para explorar modelos</div>`}
            </div>`;
        }
        function selBBTipo(t){ S.bbTipo=t; S.bbMarca=null; S.bbAnio=null; S.bbModelo=null; S.bbMedida=null; render(); }
        function selBBMarca(v){ S.bbMarca=v; S.bbAnio=null; S.bbModelo=null; S.bbMedida=null; render(); }
        function selBBAnio(v){ S.bbAnio=v; S.bbModelo=null; S.bbMedida=null; render(); }
        function selBBModelo(v){
            S.bbModelo=v; S.bbMedida=null;
            if(v){ S.bbMedida=getMedida(S.bbTipo, S.bbMarca, S.bbAnio, v); }
            render();
        }

        function bb2HTML(){
            const bielas = getBielas(S.bbTipo, S.bbMedida);
            return `<div class="min-h-screen px-6 py-8 fade-in">
                <div class="w-full flex justify-between items-center mb-8 max-w-md mx-auto">
                    <button class="p-2 hover:text-gray-300" onclick="goBack()">← Volver</button>
                    <span class="text-gray-500 text-sm font-bold">2/3</span>
                </div>
                <header class="text-center mb-6">
                    ${LogoSVG}
                    <h1 class="text-lg font-bold uppercase mt-3">Marca de Biela</h1>
                    <p class="text-xs text-gray-400 mt-1 px-4">Estándar detectado: <strong class="text-white">${S.bbMedida}</strong> • ${bielas.length} opciones</p>
                </header>
                <div class="grid grid-cols-2 gap-4 w-full max-w-md mx-auto mb-8">
                    ${bielas.map(b=>`<div class="bg-surface-low border border-surface-bright rounded-2xl p-6 flex flex-col items-center hover:border-white transition-colors cursor-pointer group" onclick="selBBBiela('${b.replace(/'/g,"\\'")}')">
                        <div class="text-xl font-bold mb-2">${b}</div>
                        <span class="text-xs text-emerald-400 font-semibold">Seleccionar</span>
                    </div>`).join('')}
                </div>
                ${bielas.length===0 ? `<p class="text-center text-gray-500 text-sm">No hay bielas compatibles registradas para ${S.bbMedida}</p>` : ''}
            </div>`;
        }
        function selBBBiela(b){
            S.bbBiela=b;
            const res = getBBResultado(S.bbTipo, S.bbMedida, b);
            if(res){ S.bbResultado=res; S.step=3; render(); }
            else { alert('No se encontró compatibilidad'); }
        }

        function bb3HTML(){
            const r=S.bbResultado;
            if(!r) return `<div class="min-h-screen flex items-center justify-center"><p class="text-gray-400">Error</p></div>`;
            return `<div class="min-h-screen bg-black px-6 py-8 flex flex-col items-center fade-in">
                <div class="w-full flex items-center justify-center relative mb-8 max-w-md">
                    <button class="absolute left-0 p-2 hover:text-gray-300" onclick="S.step=2;render();">← Volver</button>
                    ${LogoSVG}
                </div>
                <div class="w-full max-w-md bg-surface-low border border-surface-bright rounded-2xl p-6 mb-6 flex flex-col items-center">
                    <span class="bg-emerald-950 text-emerald-300 border border-emerald-800 text-[10px] px-4 py-1.5 rounded-full mb-6 uppercase tracking-widest font-bold">Match Perfecto</span>
                    <div class="w-24 h-24 bg-zinc-800 rounded-full flex items-center justify-center text-4xl mb-6 border border-zinc-700">⚙️</div>
                    <div class="bg-black border border-white/20 rounded-xl p-4 w-full text-center mb-4">
                        <span class="block text-[10px] text-gray-400 uppercase font-bold mb-1">SKU Identificado</span>
                        <span class="text-xl font-bold tracking-widest text-emerald-400">${r.sku}</span>
                    </div>
                    <h2 class="text-center font-bold text-base px-4 leading-tight">${r.nombre}</h2>
                </div>
                <div class="w-full max-w-md bg-surface-low rounded-2xl p-6 mb-8 border border-zinc-800">
                    <h3 class="text-center text-[10px] font-bold uppercase text-gray-400 mb-6 tracking-widest">Especificaciones Técnicas</h3>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between border-b border-white/10 pb-3"><span class="text-gray-400">Tecnología</span><span class="font-bold">Alpha</span></div>
                        <div class="flex justify-between border-b border-white/10 pb-3"><span class="text-gray-400">Estándar</span><span class="font-bold">${r.medida}</span></div>
                        <div class="flex justify-between border-b border-white/10 pb-3"><span class="text-gray-400">Biela</span><span class="font-bold">${r.biela}</span></div>
                        <div class="flex justify-between border-b border-white/10 pb-3"><span class="text-gray-400">Modalidad</span><span class="font-bold">${r.modalidad}</span></div>
                        <div class="flex justify-between pt-1"><span class="text-gray-400">Garantía</span><span class="font-bold">Lifetime</span></div>
                    </div>
                </div>
                <div class="w-full max-w-md space-y-3">
                    <button class="w-full py-5 bg-white text-black font-bold rounded-full uppercase tracking-wider text-sm" onclick="goHome()">Volver al Inicio</button>
                    <button class="w-full py-4 text-gray-400 font-bold uppercase text-xs hover:text-white" onclick="resetFlow('bb')">Realizar otra búsqueda</button>
                </div>
            </div>`;
        }

        function ospw1HTML(){
            const marcas=['SRAM','Shimano'];
            return `<div class="min-h-screen px-6 py-8 fade-in flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-8 max-w-md">
                    <button class="p-2 hover:text-gray-300" onclick="goBack()">← Volver</button>
                    <span class="text-gray-500 text-sm font-bold">1/3</span>
                </div>
                <header class="text-center mb-8">
                    ${LogoSVG}
                    <div class="w-20 h-24 my-4 bg-zinc-800 rounded-2xl mx-auto flex items-center justify-center text-4xl border border-zinc-700">🚲</div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-[.2em]">OverSized Pulley Wheel System</p>
                    <h1 class="text-xl font-bold mt-2">Optimiza tu transmisión.</h1>
                    <p class="text-xs text-gray-400 mt-2">Selecciona la marca de tu tensor</p>
                </header>
                <div class="w-full max-w-md space-y-4">
                    ${marcas.map(b=>`<div class="bg-surface-low border border-surface-bright rounded-2xl p-8 flex flex-col items-center hover:border-white transition-colors cursor-pointer" onclick="selOSPWMarca('${b}')">
                        <div class="text-xl font-black tracking-widest mb-1 text-gray-200">${b.toUpperCase()}</div>
                        <span class="text-[10px] text-gray-400 uppercase">${getOSPWMODALIDADES(b).length} modalidades</span>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        function selOSPWMarca(marca){ S.ospwMarca=marca; S.ospwModalidad=null; S.ospwRef=null; S.ospwResultados=null; S.step=2; render(); }

        function ospw2HTML(){
            const mods=getOSPWMODALIDADES(S.ospwMarca);
            return `<div class="min-h-screen px-6 py-8 fade-in flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-8 max-w-md">
                    <button class="p-2 hover:text-gray-300" onclick="goBack()">← Volver</button>
                    <span class="text-gray-500 text-sm font-bold">2/3</span>
                </div>
                <header class="text-center mb-8">
                    ${LogoSVG}
                    <h1 class="text-lg font-bold uppercase mb-2 mt-3">Seleccionar Modalidad</h1>
                    <p class="text-xs text-gray-400">Marca: <strong class="text-white">${S.ospwMarca}</strong></p>
                </header>
                <div class="w-full max-w-md space-y-4">
                    ${mods.map(m=>`<div class="bg-surface-low border border-surface-bright rounded-2xl p-8 flex flex-col items-center hover:border-white transition-colors cursor-pointer" onclick="selOSPWModalidad('${m}')">
                        <span class="text-lg font-bold uppercase tracking-wider">${m}</span>
                        <span class="text-[10px] text-gray-400 mt-1">${getReferencias(S.ospwMarca,m).length} tensores</span>
                    </div>`).join('')}
                </div>
            </div>`;
        }
        function selOSPWModalidad(mod){ S.ospwModalidad=mod; S.ospwRef=null; S.ospwResultados=null; S.step=3; render(); }

        function ospw3HTML(){
            const refs=getReferencias(S.ospwMarca, S.ospwModalidad);
            const hasResults=S.ospwResultados && S.ospwResultados.length>0;
            let resHTML='';
            if(S.ospwResultados && S.ospwResultados.length>0){
                const items=S.ospwResultados.map(r=>`<div class="bg-surface-low border border-surface-bright rounded-2xl p-6 mb-4 flex flex-col items-center">
                    <span class="bg-emerald-950 text-emerald-300 border border-emerald-800 text-[10px] px-4 py-1.5 rounded-full mb-4 uppercase tracking-widest font-bold">Sistema Compatible</span>
                    <div class="w-20 h-20 bg-zinc-800 rounded-full flex items-center justify-center text-3xl mb-4 border border-zinc-700">🚲</div>
                    <div class="bg-black border border-white/20 rounded-xl p-3 w-full text-center mb-3">
                        <span class="block text-[10px] text-gray-400 uppercase font-bold mb-1">SKU</span>
                        <span class="text-lg font-bold tracking-widest text-emerald-400">${r.sku}</span>
                    </div>
                    <h3 class="text-center font-bold text-sm px-2 leading-tight">${r.nombre}</h3>
                    <div class="mt-3 text-[10px] text-gray-400 text-center">Tensores: ${r.tensores.join(' • ')}</div>
                    <div class="mt-1 text-[10px] text-gray-400">Modalidad: ${r.modalidad}</div>
                </div>`).join('');
                resHTML=`<div class="w-full max-w-md mt-6">
                    <p class="text-[10px] text-gray-400 mb-4 text-center uppercase tracking-wider font-bold">${S.ospwResultados.length} OSPW compatibles encontrados:</p>
                    ${items}
                </div>`;
            }
            return `<div class="min-h-screen px-6 py-8 fade-in flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-8 max-w-md">
                    <button class="p-2 hover:text-gray-300" onclick="goBack()">← Volver</button>
                    <span class="text-gray-500 text-sm font-bold">3/3</span>
                </div>
                <header class="text-center mb-6">
                    ${LogoSVG}
                    <h1 class="text-base font-bold uppercase mt-3">Configuración de OSPW</h1>
                    <p class="text-xs text-gray-400 mt-1">${S.ospwMarca} | <strong class="text-white">${S.ospwModalidad}</strong> • ${refs.length} refs</p>
                </header>
                <div class="w-full max-w-md space-y-5 mb-6">
                    <div><label class="block text-[10px] text-gray-400 mb-2 text-center uppercase tracking-wider">Marca del Tensor</label>
                        <div class="w-full bg-surface-low border border-surface-bright rounded-xl p-4 text-white font-bold text-center text-sm">${S.ospwMarca}</div></div>
                    <div><label class="block text-[10px] text-gray-400 mb-2 text-center uppercase tracking-wider">Referencia del Tensor</label>
                        <select id="ospwRefSel" class="w-full bg-surface-low border border-surface-bright rounded-xl p-4 text-white font-bold appearance-none cursor-pointer text-sm" onchange="onRefChange(this.value)">
                            <option value="">Seleccionar Referencia (${refs.length})</option>
                            ${refs.map(r=>`<option value="${r}" ${S.ospwRef===r?'selected':''}>${r}</option>`).join('')}
                        </select></div>
                </div>
                <button id="ospwBtn" class="w-full max-w-md py-5 bg-white text-black font-bold rounded-full uppercase tracking-wider text-sm ${S.ospwRef ? '' : 'hidden'}" onclick="buscarOSPWAction()">Buscar OSPW</button>
                ${resHTML}
                ${hasResults ? `<div class="w-full max-w-md mt-6 space-y-3">
                    <button class="w-full py-5 bg-white text-black font-bold rounded-full uppercase tracking-wider text-sm" onclick="goHome()">Volver al Inicio</button>
                    <button class="w-full py-4 text-gray-400 font-bold uppercase text-xs hover:text-white" onclick="resetFlow('ospw')">Realizar otra búsqueda</button>
                </div>` : ''}
            </div>`;
        }
        function onRefChange(val){ S.ospwRef=val; const btn=document.getElementById('ospwBtn'); if(btn){ if(val) btn.classList.remove('hidden'); else btn.classList.add('hidden'); } }
        function buscarOSPWAction(){ if(!S.ospwRef) return; S.ospwResultados=buscarOSPW(S.ospwRef); render(); }

        render();
    </script>
</body>
</html>
