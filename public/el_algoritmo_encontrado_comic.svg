<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121314"/>
      <stop offset="100%" stop-color="#24282c"/>
    </linearGradient>

    <linearGradient id="screenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b4d"/>
      <stop offset="100%" stop-color="#005580"/>
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Frame -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <!-- Comic Title Header Bar -->
  <rect x="20" y="15" width="1160" height="40" fill="#ffffff" rx="4"/>
  <text x="35" y="42" fill="#000000" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="900" font-style="italic" letter-spacing="1">
    EL ALGORITMO ENCONTRADO
  </text>

  <!-- 4-PANEL GRID CONTAINER -->
  <g transform="translate(20, 65)">

    <!-- ==================== PANEL 1 (Top-Left) ==================== -->
    <g transform="translate(0, 0)">
      <!-- Border Frame -->
      <rect width="570" height="280" fill="#2d3136" stroke="#ffffff" stroke-width="6" rx="2"/>
      <!-- Background / Workshop Room -->
      <rect x="6" y="6" width="558" height="268" fill="#3c2f27"/>
      <!-- Workshop Pegboard & Shelves -->
      <line x1="6" y1="80" x2="564" y2="80" stroke="#1f1712" stroke-width="4"/>
      <!-- Hanging Wheels & Tools on Wall -->
      <circle cx="80" cy="45" r="25" fill="none" stroke="#888" stroke-width="3"/>
      <rect x="180" y="30" width="120" height="35" fill="#221a14" stroke="#555" stroke-width="2"/>

      <!-- Laptop with Matrix Green Code Screen -->
      <rect x="270" y="110" width="220" height="130" fill="#111111" stroke="#444" stroke-width="4" rx="4"/>
      <rect x="280" y="118" width="200" height="114" fill="#031408" rx="2"/>
      <!-- Green Code lines -->
      <g fill="#00ff66" font-family="monospace" font-size="9" font-weight="bold" filter="url(#glowGreen)">
        <text x="288" y="132">&gt; A.I. ALGORITHM SEARCH v2.4</text>
        <text x="288" y="145">&gt; SCANNING HISTORIC PATENTS...</text>
        <text x="288" y="158">&gt; MATCH FOUND: 1928 CYCLOID</text>
        <text x="288" y="171">[STATUS: OPTIMIZED]</text>
      </g>
      <!-- Bicycle schematic on laptop -->
      <circle cx="430" cy="190" r="22" fill="none" stroke="#00ff66" stroke-width="1.5"/>
      <circle cx="380" cy="190" r="22" fill="none" stroke="#00ff66" stroke-width="1.5"/>
      <path d="M 380 190 L 405 165 L 430 190" stroke="#00ff66" stroke-width="1.5" fill="none"/>

      <!-- Laptop Base & Keyboard -->
      <path d="M 240 240 L 510 240 L 530 260 L 220 260 Z" fill="#222222" stroke="#444" stroke-width="2"/>

      <!-- Person (Left, Male Technician) -->
      <g transform="translate(80, 70)">
        <!-- Shirt -->
        <path d="M 30 70 L 90 70 L 105 190 L 15 190 Z" fill="#3a5a40"/>
        <!-- Head -->
        <ellipse cx="60" cy="40" rx="22" ry="26" fill="#8d5b4c"/>
        <path d="M 38 32 C 38 12 82 12 82 32 Z" fill="#1a0f0a"/>
      </g>

      <!-- Panel 1 Number Box -->
      <rect x="6" y="6" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <text x="21" y="27" fill="#000000" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">1</text>
    </g>

    <!-- ==================== PANEL 2 (Top-Right) ==================== -->
    <g transform="translate(590, 0)">
      <!-- Border Frame -->
      <rect width="570" height="280" fill="#1a1c1e" stroke="#ffffff" stroke-width="6" rx="2"/>
      <!-- Background (Dark Ambient Room) -->
      <rect x="6" y="6" width="558" height="268" fill="#0d1117"/>

      <!-- Hand Holding Smartphone -->
      <path d="M 380 200 Q 420 140 500 160 L 564 274 L 350 274 Z" fill="#8d5b4c"/>

      <!-- Smartphone Body -->
      <rect x="110" y="30" width="350" height="210" fill="#1f2328" stroke="#555555" stroke-width="4" rx="22"/>
      <!-- Smartphone Screen with Blueprint -->
      <rect x="125" y="42" width="320" height="186" fill="url(#screenBlue)" rx="8" stroke="#00d4ff" stroke-width="2"/>

      <!-- Blueprint Content inside Smartphone -->
      <g stroke="#ffffff" stroke-width="1.5" fill="none">
        <text x="140" y="62" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">
          PATENT BRAMING - CYCLOID DRIVE SYSTEM - 1928
        </text>
        <line x1="140" y1="68" x2="430" y2="68" stroke="#00f0ff" stroke-width="1"/>

        <!-- Bicycle Patent Wireframe -->
        <circle cx="200" cy="140" r="45" stroke="#ffffff" stroke-dasharray="4,2"/>
        <circle cx="360" cy="140" r="45" stroke="#ffffff" stroke-dasharray="4,2"/>

        <path d="M 200 140 L 260 140 L 300 85 L 230 85 Z" stroke="#ffffff" stroke-width="2"/>
        <path d="M 260 140 L 320 85 L 360 140" stroke="#ffffff" stroke-width="2"/>
        <path d="M 300 85 L 360 85" stroke="#ffffff" stroke-width="2"/>

        <!-- Angle Measurement Arc -->
        <path d="M 260 120 A 20 20 0 0 1 280 140" stroke="#ffbe0b" stroke-width="2"/>
        <text x="285" y="125" fill="#ffbe0b" font-family="sans-serif" font-size="10" font-weight="bold">90°</text>
      </g>

      <!-- Panel 2 Number Box -->
      <rect x="6" y="6" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <text x="21" y="27" fill="#000000" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">2</text>
    </g>

    <!-- ==================== PANEL 3 (Bottom-Left) ==================== -->
    <g transform="translate(0, 295)">
      <!-- Border Frame -->
      <rect width="570" height="280" fill="#2d3136" stroke="#ffffff" stroke-width="6" rx="2"/>
      <rect x="6" y="6" width="558" height="268" fill="#1b2028"/>

      <!-- Desktop Monitor -->
      <rect x="40" y="25" width="360" height="210" fill="#0a0e14" stroke="#444" stroke-width="5" rx="6"/>
      <rect x="52" y="37" width="336" height="186" fill="#001f3f" stroke="#00d4ff" stroke-width="1.5"/>

      <!-- Blueprint Content on Monitor -->
      <text x="65" y="58" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">
        PATENT DRAWING - CYCLOID DRIVE SYSTEM - 1926
      </text>

      <!-- Red Coordinates Box (as seen in image 2 panel 3) -->
      <rect x="65" y="70" width="170" height="40" fill="rgba(255,0,0,0.2)" stroke="#ff0055" stroke-width="1.5" rx="4"/>
      <text x="73" y="86" fill="#ff0055" font-family="sans-serif" font-size="11" font-weight="900" filter="url(#glowRed)">
        COORDINATES FOUND:
      </text>
      <text x="73" y="102" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900">
        41.385, 2.174
      </text>

      <!-- Bicycle Blueprint Vector -->
      <circle cx="150" cy="160" r="35" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <circle cx="290" cy="160" r="35" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <path d="M 150 160 L 210 160 L 245 115 L 180 115 Z" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <path d="M 210 160 L 265 115 L 290 160" fill="none" stroke="#00f0ff" stroke-width="2"/>

      <!-- Person (Right, Male engineer holding stylus) -->
      <g transform="translate(340, 40)">
        <!-- Shirt -->
        <path d="M 20 80 L 110 80 L 130 200 L 0 200 Z" fill="#1d70b8"/>
        <!-- Head -->
        <ellipse cx="65" cy="45" rx="25" ry="30" fill="#8d5b4c"/>
        <path d="M 40 35 C 40 10 90 10 90 35 Z" fill="#1a0f0a"/>
        <!-- Hand with Stylus -->
        <path d="M -20 120 L 20 110 L 30 125 Z" fill="#8d5b4c"/>
        <line x1="-30" y1="125" x2="25" y2="110" stroke="#ffbe0b" stroke-width="4"/>
      </g>

      <!-- Panel 3 Number Box -->
      <rect x="6" y="6" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <text x="21" y="27" fill="#000000" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">3</text>
    </g>

    <!-- ==================== PANEL 4 (Bottom-Right) ==================== -->
    <g transform="translate(590, 295)">
      <!-- Border Frame -->
      <rect width="570" height="280" fill="#22252a" stroke="#ffffff" stroke-width="6" rx="2"/>
      <!-- Background Sky & Environment -->
      <rect x="6" y="6" width="558" height="268" fill="#7a8b99"/>

      <!-- Grass Ground -->
      <rect x="6" y="210" width="558" height="64" fill="#4a5d4e"/>

      <!-- Historic Brick Factory Building (Background Right) -->
      <g transform="translate(260, 40)">
        <path d="M 0 50 L 240 50 L 240 170 L 0 170 Z" fill="#8d4b38" stroke="#4a2218" stroke-width="3"/>
        <path d="M 0 50 L 120 10 L 240 50 Z" fill="#6d3b2c" stroke="#4a2218" stroke-width="3"/>

        <!-- Factory Windows -->
        <rect x="20" y="70" width="35" height="30" fill="#111" stroke="#ccc" stroke-width="1.5"/>
        <rect x="75" y="70" width="35" height="30" fill="#111" stroke="#ccc" stroke-width="1.5"/>
        <rect x="130" y="70" width="35" height="30" fill="#111" stroke="#ccc" stroke-width="1.5"/>
        <rect x="185" y="70" width="35" height="30" fill="#111" stroke="#ccc" stroke-width="1.5"/>

        <!-- Factory Gate & Sign -->
        <rect x="30" y="120" width="180" height="30" fill="#ffffff" stroke="#333" stroke-width="2" rx="3"/>
        <text x="120" y="140" fill="#111111" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">
          FABRICA DE BICICLETAS - EST. 1928
        </text>
      </g>

      <!-- Cyclist riding bike in foreground (Left to Right) -->
      <g transform="translate(60, 100)">
        <!-- Wheels -->
        <circle cx="50" cy="110" r="38" fill="none" stroke="#222222" stroke-width="5"/>
        <circle cx="170" cy="110" r="38" fill="none" stroke="#222222" stroke-width="5"/>
        <!-- Frame -->
        <path d="M 50 110 L 105 110 L 140 60 L 80 60 Z" fill="none" stroke="#0077ff" stroke-width="5"/>
        <path d="M 105 110 L 135 60 L 170 110" fill="none" stroke="#0077ff" stroke-width="5"/>
        <!-- Cyclist Figure -->
        <path d="M 80 60 L 100 20 L 125 35 L 140 60" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
        <circle cx="100" cy="10" r="10" fill="#8d5b4c"/>
        <!-- Helmet -->
        <path d="M 90 10 Q 100 -2 112 10 Z" fill="#e63946"/>
      </g>

      <!-- Panel 4 Number Box -->
      <rect x="6" y="6" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <text x="21" y="27" fill="#000000" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">4</text>
    </g>

  </g>
</svg>
