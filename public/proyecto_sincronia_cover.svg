<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="40%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1d2a44"/>
    </linearGradient>

    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="50%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,240,255,0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Blueprint Circuit Grid Left Side -->
  <rect x="0" y="0" width="420" height="675" fill="url(#grid)" />
  <rect x="0" y="0" width="420" height="675" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Tech Blueprint Circuit Lines & Nodes -->
  <g stroke="#00f0ff" stroke-width="2.5" fill="none" filter="url(#glow)">
    <!-- Circuit lines -->
    <path d="M 0 100 L 140 100 L 200 160 L 320 160" />
    <path d="M 0 220 L 100 220 L 150 270 L 350 270" />
    <path d="M 0 380 L 180 380 L 240 440 L 380 440" />
    <path d="M 0 520 L 120 520 L 180 580 L 300 580" />

    <!-- Vertical bus connectors -->
    <path d="M 140 100 L 140 520" stroke-dasharray="6,6"/>
    <path d="M 240 180 L 240 440" stroke-width="1.5"/>

    <!-- Nodes -->
    <circle cx="140" cy="100" r="5" fill="#00f0ff"/>
    <circle cx="200" cy="160" r="5" fill="#00f0ff"/>
    <circle cx="150" cy="270" r="5" fill="#00f0ff"/>
    <circle cx="240" cy="440" r="5" fill="#00f0ff"/>
    <circle cx="180" cy="580" r="5" fill="#00f0ff"/>
  </g>

  <!-- Blueprint Boxes & Schematics -->
  <rect x="220" y="80" width="150" height="90" fill="rgba(0,119,255,0.15)" stroke="#00f0ff" stroke-width="1.5" rx="6"/>
  <text x="230" y="102" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">PROYECTO SINCRONÍA</text>
  <line x1="230" y1="110" x2="350" y2="110" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="235" y="120" width="60" height="35" fill="none" stroke="#00f0ff" stroke-dasharray="3,3"/>
  <circle cx="320" cy="138" r="14" fill="none" stroke="#00f0ff"/>
  <path d="M 310 138 L 330 138 M 320 128 L 320 148" stroke="#00f0ff"/>

  <!-- Blueprint Labels -->
  <text x="25" y="135" fill="#00f0ff" font-family="sans-serif" font-size="18" font-weight="900" letter-spacing="3" filter="url(#glow)">NEXO</text>
  <text x="25" y="315" fill="#00f0ff" font-family="sans-serif" font-size="18" font-weight="900" letter-spacing="3" filter="url(#glow)">NEXO</text>
  <text x="25" y="480" fill="#00f0ff" font-family="sans-serif" font-size="18" font-weight="900" letter-spacing="3" filter="url(#glow)">GRID DATA</text>

  <!-- Railway Depot Background (Right side) -->
  <g opacity="0.35">
    <!-- Brick Arch Building -->
    <path d="M 850 120 L 1200 120 L 1200 675 L 850 675 Z" fill="#3a251e"/>
    <path d="M 900 240 Q 1020 160 1140 240 L 1140 675 L 900 675 Z" fill="#1e1310" stroke="#8d5b4c" stroke-width="3"/>
    <!-- Depot Sign -->
    <rect x="910" y="180" width="220" height="45" fill="#222" stroke="#d4a373" stroke-width="3" rx="4"/>
    <text x="1020" y="200" fill="#f4a261" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DEPÓSITO FERROVIARIO</text>
    <text x="1020" y="217" fill="#e9c46a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">EST. CENTRAL</text>

    <!-- Train Track -->
    <path d="M 600 675 L 850 480 M 720 675 L 900 480 M 850 675 L 980 480" stroke="#777" stroke-width="4"/>
  </g>

  <!-- Characters & Electric Bike Illustration -->
  <g transform="translate(320, 100)">
    <!-- Electric Bike with Glowing Cyan Wheels -->
    <g transform="translate(150, 220)">
      <!-- Glowing Wheels -->
      <circle cx="60" cy="180" r="75" fill="none" stroke="#00f0ff" stroke-width="8" filter="url(#glowStrong)"/>
      <circle cx="60" cy="180" r="75" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="60" cy="180" r="60" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10,5"/>

      <circle cx="340" cy="180" r="75" fill="none" stroke="#00f0ff" stroke-width="8" filter="url(#glowStrong)"/>
      <circle cx="340" cy="180" r="75" fill="none" stroke="#ffffff" stroke-width="3"/>
      <circle cx="340" cy="180" r="60" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10,5"/>

      <!-- Bike Frame -->
      <path d="M 60 180 L 160 180 L 230 70 L 120 70 Z" fill="none" stroke="#2d6a4f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 160 180 L 280 70 L 340 180" fill="none" stroke="#2d6a4f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 230 70 L 340 70" stroke="#2d6a4f" stroke-width="8"/>

      <!-- Glowing Cyan Battery Box & Electric Wires -->
      <rect x="140" y="110" width="70" height="40" fill="#00f0ff" rx="6" filter="url(#glow)"/>
      <rect x="145" y="115" width="60" height="30" fill="#ffffff" rx="4"/>
      <text x="175" y="135" fill="#0077ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">POWER</text>

      <!-- Electric energy aura -->
      <path d="M 50 140 Q 100 110 140 125" stroke="#00f0ff" stroke-width="4" fill="none" filter="url(#glow)"/>
      <path d="M 210 125 Q 260 110 330 130" stroke="#00f0ff" stroke-width="4" fill="none" filter="url(#glow)"/>
      <!-- Lightning bolts -->
      <path d="M 40 120 L 55 135 L 48 140 L 65 160" stroke="#ffffff" stroke-width="2.5" fill="none" filter="url(#glow)"/>
      <path d="M 330 120 L 345 135 L 338 140 L 355 160" stroke="#ffffff" stroke-width="2.5" fill="none" filter="url(#glow)"/>
    </g>

    <!-- Man Character (Left Technician) -->
    <g transform="translate(230, 20)">
      <!-- Body / Blue Uniform -->
      <path d="M 40 120 L 110 120 L 125 360 L 25 360 Z" fill="#1d3557"/>
      <!-- Belt -->
      <rect x="30" y="220" width="90" height="18" fill="#333" rx="3"/>
      <rect x="65" y="221" width="20" height="16" fill="#e9c46a"/>
      <!-- Shirt collar & details -->
      <path d="M 55 120 L 75 160 L 95 120" fill="#457b9d"/>
      <!-- Head / Face -->
      <ellipse cx="75" cy="75" rx="28" ry="34" fill="#8d5b4c"/>
      <!-- Hair -->
      <path d="M 47 65 C 47 40 103 40 103 65 C 95 45 55 45 47 65 Z" fill="#1a0f0a"/>
      <!-- Smile & Eyes -->
      <path d="M 60 88 Q 75 100 90 88" stroke="#ffffff" stroke-width="3" fill="none"/>
      <circle cx="63" cy="70" r="3" fill="#1a0f0a"/>
      <circle cx="87" cy="70" r="3" fill="#1a0f0a"/>
    </g>

    <!-- Woman Engineer Character (Right) -->
    <g transform="translate(420, 60)">
      <!-- Coat / Jacket -->
      <path d="M 30 110 L 95 110 L 110 320 L 15 320 Z" fill="#2a6f97"/>
      <!-- Inner shirt -->
      <path d="M 48 110 L 62 150 L 78 110" fill="#e0e1dd"/>
      <!-- Badge -->
      <rect x="75" y="150" width="18" height="25" fill="#ffffff" stroke="#333" stroke-width="1" rx="2"/>
      <circle cx="84" cy="160" r="5" fill="#0077ff"/>
      <!-- Head / Face -->
      <ellipse cx="62" cy="70" rx="24" ry="28" fill="#e0a96d"/>
      <!-- Silver / Grey Hair -->
      <path d="M 35 68 C 35 30 90 30 90 68 C 95 45 30 45 35 68 Z" fill="#d6dbdc"/>
      <!-- Glasses -->
      <rect x="46" y="60" width="14" height="10" fill="none" stroke="#333" stroke-width="2" rx="2"/>
      <rect x="64" y="60" width="14" height="10" fill="none" stroke="#333" stroke-width="2" rx="2"/>
      <line x1="60" y1="65" x2="64" y2="65" stroke="#333" stroke-width="2"/>
      <!-- Smile -->
      <path d="M 52 82 Q 62 90 72 82" stroke="#333" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Title Banner (Top Center) -->
  <g transform="translate(390, 15)">
    <!-- Comic Title Box -->
    <rect x="0" y="0" width="480" height="90" fill="#111" rx="12" stroke="#ffbe0b" stroke-width="4" filter="url(#glow)"/>

    <!-- GEAR ICON in Title -->
    <g transform="translate(380, 12)">
      <circle cx="25" cy="25" r="22" fill="#ff9900" stroke="#ffffff" stroke-width="2"/>
      <circle cx="25" cy="25" r="10" fill="#111"/>
      <!-- Teeth -->
      <rect x="21" y="-2" width="8" height="54" fill="#ff9900" rx="2"/>
      <rect x="21" y="-2" width="8" height="54" fill="#ff9900" rx="2" transform="rotate(45, 25, 25)"/>
      <rect x="21" y="-2" width="8" height="54" fill="#ff9900" rx="2" transform="rotate(90, 25, 25)"/>
      <rect x="21" y="-2" width="8" height="54" fill="#ff9900" rx="2" transform="rotate(135, 25, 25)"/>
    </g>

    <text x="200" y="52" fill="url(#titleGrad)" font-family="Impact, 'Arial Black', sans-serif" font-size="46" font-style="italic" text-anchor="middle" letter-spacing="1" stroke="#000000" stroke-width="2">
      PROYECTO
    </text>
    <text x="210" y="82" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="34" font-style="italic" font-weight="900" text-anchor="middle" letter-spacing="2" stroke="#ff9900" stroke-width="1.5">
      SINCRONÍA
    </text>
  </g>

  <!-- Comic Header Bar (Top Left) -->
  <rect x="25" y="20" width="180" height="35" fill="#e63946" rx="6" stroke="#ffffff" stroke-width="2"/>
  <text x="115" y="43" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
    No. 1 | $4.99
  </text>

  <!-- Subtitle Ribbon -->
  <g transform="translate(360, 115)">
    <rect x="0" y="0" width="540" height="28" fill="#000000" rx="4" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="270" y="19" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="2">
      EL NEXO ENTRE EL AYER Y EL MAÑANA
    </text>
  </g>

  <!-- Artist Credits Footer (Bottom Left) -->
  <g transform="translate(25, 635)">
    <rect x="0" y="0" width="380" height="30" fill="rgba(0,0,0,0.8)" rx="4" stroke="#ffffff" stroke-width="1"/>
    <text x="15" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">
      ART: JAVIER MARTÍNEZ / COLORS: ANA LUNA
    </text>
  </g>
</svg>
